<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Bakımdayız · Kapanış</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      color: #f3f5f4; background: radial-gradient(circle at 50% 20%, #193a34, #0d1716 55%, #080e0d); }
    main { width: min(100%, 540px); border: 1px solid #305149; border-radius: 24px;
      padding: clamp(28px, 6vw, 48px); background: #12221f; box-shadow: 0 20px 70px #0005; }
    .mark { display: inline-flex; align-items: center; gap: 10px; color: #91dac5; font-weight: 800; letter-spacing: .03em; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #53c9a9; box-shadow: 0 0 0 5px #53c9a923; }
    h1 { margin: 34px 0 12px; font-size: clamp(30px, 7vw, 46px); line-height: 1.12; letter-spacing: -.04em; }
    p { color: #bdceca; line-height: 1.65; font-size: 17px; }
    .foot { margin-top: 28px; padding-top: 22px; border-top: 1px solid #305149; color: #92aaa3; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="mark"><span class="dot" aria-hidden="true"></span>KAPANIŞ</div>
    <h1>Kısa bir bakımdayız.</h1>
    <p>Yeni özellikleri hazırlarken siteye erişimi geçici olarak durdurduk. Biraz sonra tekrar deneyebilirsin.</p>
    <div class="foot">Portföy kayıtların ve analizlerin korunuyor. Gerçek borsa emri gönderilmiyor.</div>
  </main>
</body>
</html>
