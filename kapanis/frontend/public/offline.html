<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Kapanış — bağlantı yok</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0e1116; color: #f5f7fa;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 22rem; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { margin: 20px 0 8px; font-size: 1.375rem; line-height: 1.25; }
  p { margin: 0 0 20px; color: #aab4c3; }
  button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #2dd4bf; color: #050608; font: inherit; font-weight: 700; }
  button:active { transform: scale(0.98); }
  small { display: block; margin-top: 16px; color: #7c8797; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>Bağlantı yok</h1>
  <p>Kapanış fiyatları ve portföyü canlı okur; internet olmadan eski veriyi göstermez. Bağlantı gelince sayfa kendiliğinden açılır.</p>
  <button type="button" id="retry">Tekrar dene</button>
  <small id="state" role="status">Bağlantı bekleniyor…</small>
</main>
<script>
  var go = function () { location.reload(); };
  document.getElementById("retry").addEventListener("click", go);
  window.addEventListener("online", go);
  setInterval(function () { if (navigator.onLine) fetch("/manifest.json", { cache: "no-store" }).then(go).catch(function () {}); }, 5000);
</script>
</body>
</html>
