# Render Blueprint (New -> Blueprint -> this repo). Both services in Frankfurt: Binance's API refuses
# requests from US data centres, and the MongoDB Atlas cluster is in AWS Frankfurt (eu-central-1).
#
# web    = site + API. Starter plan: free web services sleep after 15 minutes idle.
# worker = the Telegram bot, alarms and scheduled jobs. Must run 24/7; Render's free plan has no
#          background workers, so this is a paid worker that never sleeps.
# Values marked sync:false are entered in the Render dashboard (Environment), never in this file.
services:
  - type: web
    name: kapanis-web
    runtime: docker
    region: frankfurt
    plan: starter
    dockerCommand: /app/start.sh web
    healthCheckPath: /api/
    envVars:
      - key: AUTH_MODE
        value: clerk
      - key: TRUST_PROXY
        value: "1"
      - key: STATE_MONGO_URL
        sync: false
      - key: STATE_DB_NAME
        value: kapanis
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_API_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: USER_DAILY_ANALYSES
        value: "5"
  - type: worker
    name: kapanis-bot
    runtime: docker
    region: frankfurt
    plan: starter
    dockerCommand: /app/start.sh worker
    envVars:
      - key: WEB_URL
        sync: false
      - key: BOT_API_KEY
        sync: false
      - key: STATE_MONGO_URL
        sync: false
      - key: STATE_DB_NAME
        value: kapanis
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_CHAT_ID
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: TIINGO_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: BLS_API_KEY
        sync: false
      - key: CFTC_APP_TOKEN
        sync: false
      - key: SEC_USER_AGENT
        sync: false
